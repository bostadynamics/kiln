[project]
name = "kiln"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "pyserial (>=3.5,<4.0)",
    "minimalmodbus (>=2.1.1,<3.0.0)",
    "fastapi[standard] (>=0.124.2,<0.125.0)",
    "jinja2 (>=3.1.6,<4.0.0)",
    "redis (>=7.1.0,<8.0.0)",
    "duckdb (>=1.4.3,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
ipython = ">=9.8.0,<10.0.0"
taskipy = "^1.14.1"

[tool.taskipy.tasks]
test = "python -m unittest discover tests"
deploy = "rsync -r --exclude '.venv' --exclude '__pycache__' --exclude '.git' . kiln:/home/kiln/kiln-prd/"
server = "python controller_server.py"
web = "python web.py"
monitor = "python monitor.py"
up = "docker compose up --build"
down = "docker compose down"

